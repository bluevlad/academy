# ============================================
# academy.unmong.com — Academy 통합 학원 운영 시스템 (HTTPS)
#
# 소유자: academy repo (이 파일)
# 사용 주체: 호스트의 unmong-gateway (nginx:1.27-alpine) 컨테이너가
#   /Users/rainend/GIT/Claude-Opus-bluevlad/infrastructure/docker/docker-compose.gateway.yml
#   에서 정의된 bind mount 를 통해 이 파일을 /etc/nginx/conf.d/academy.conf 로 적재.
#
# 운영 원칙 (Claude-Opus-bluevlad ENVIRONMENT_STANDARD):
#   - Claude-Opus-bluevlad 에는 플랜/표준 문서와 service-registry(SSoT) 만 등록.
#   - 실제 운영 nginx 설정은 각 서비스 repo 가 소유 (academy = 이 파일).
#   - service-registry.yaml 의 academy 블록은 managed: false + nginx.conf_owner: academy-repo
#     로 표기되어 generator 가 이 파일을 덮어쓰지 않음.
#
# 토폴로지:
#   - backend(:9001) 단일 Spring Boot. URL prefix 로 admin/user 경계 강제
#     (/api/admin/**, /api/user/**, /api/shared/**)
#   - admin-web(:4001) · user-web(:4002) 개별 컨테이너 (Vite 빌드)
#   - Swagger UI / OpenAPI 는 무인증 공개, 실제 API 호출만 ADMIN/USER 역할 검증
#
# ⚠️ X-Forwarded-Prefix 금지:
#   backend application.yml 의 server.forward-headers-strategy=framework 가
#   ForwardedHeaderFilter 를 활성화해서 X-Forwarded-Prefix 를 contextPath 로 인식.
#   이로 인해 Spring Security 의 path 매칭이 어긋나 보호 경로가 401 을 반환함
#   (예: /admin/api/member/... → /api/member/... 로 rewrite 후 prefix 추가시 401).
#   SPA 환경에서 backend 가 prefix 를 알 필요 없으므로 이 헤더는 일체 set 하지 않는다.
# ============================================
server {
    listen 443 ssl;
    server_name academy.unmong.com;

    ssl_certificate /etc/letsencrypt/live/unmong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unmong.com/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;
    include /etc/nginx/snippets/security-params.conf;

    # Swagger UI / OpenAPI — 무인증 공개 (SecurityConfig permitAll). /api/user/** rewrite 회피 위해
    # ^~ 로 일반 /api/ location 보다 우선 매치. 실제 API 호출은 아래 /api/ · /admin/api/ 를 거쳐 인증.
    location ^~ /api/swagger-ui {
        proxy_pass http://host.docker.internal:9001/swagger-ui;
        include /etc/nginx/conf.d/proxy-params.conf;
    }
    location ^~ /api/v3/api-docs {
        proxy_pass http://host.docker.internal:9001/v3/api-docs;
        include /etc/nginx/conf.d/proxy-params.conf;
    }
    location ^~ /api/webjars {
        proxy_pass http://host.docker.internal:9001/webjars;
        include /etc/nginx/conf.d/proxy-params.conf;
    }
    location ^~ /admin/api/swagger-ui {
        proxy_pass http://host.docker.internal:9001/swagger-ui;
        include /etc/nginx/conf.d/proxy-params.conf;
    }
    location ^~ /admin/api/v3/api-docs {
        proxy_pass http://host.docker.internal:9001/v3/api-docs;
        include /etc/nginx/conf.d/proxy-params.conf;
    }
    location ^~ /admin/api/webjars {
        proxy_pass http://host.docker.internal:9001/webjars;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # Admin Auth — /api/auth/** 는 admin/user 공통 shared 엔드포인트이므로 /api/admin/ 로
    # rewrite 하면 안 됨. /admin/api/ 보다 먼저 매치하도록 ^~ 사용.
    location ^~ /admin/api/auth/ {
        proxy_pass http://host.docker.internal:9001/api/auth/;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # Admin Shared API — 공통 /api/shared/**
    location ^~ /admin/api/shared/ {
        proxy_pass http://host.docker.internal:9001/api/shared/;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # Admin Backend API
    #   /admin/api/xyz → :9001/api/xyz
    #
    # ^~ 로 plain prefix 가 regex location 에 가로채지지 않도록 명시.
    # legacy flat path(/api/member, /api/board 등) 와 신규(/api/admin/menu) 둘 다 매치.
    location ^~ /admin/api/ {
        proxy_pass http://host.docker.internal:9001/api/;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # Admin Frontend — trailing slash 로 /admin/ prefix strip.
    # 브라우저의 /admin/assets/foo.js → 컨테이너의 /assets/foo.js 로 도착.
    # admin-web 번들은 vite base=/admin/ 이므로 SPA navigation 시 /admin/login 같은
    # 브라우저 URL 이 유지된다.
    location /admin/ {
        proxy_pass http://host.docker.internal:4001/;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # User Auth — /api/auth/** 는 shared 엔드포인트 (/api/auth 그대로). user 로 rewrite 금지.
    # /api/ 일반 location 보다 ^~ 가 우선.
    location ^~ /api/auth/ {
        proxy_pass http://host.docker.internal:9001/api/auth/;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # User Shared API — 공통 /api/shared/**
    location ^~ /api/shared/ {
        proxy_pass http://host.docker.internal:9001/api/shared/;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # User Backend API
    #   /api/xyz → :9001/api/user/xyz
    location /api/ {
        proxy_pass http://host.docker.internal:9001/api/user/;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # User Frontend (default)
    location / {
        proxy_pass http://host.docker.internal:4002;
        include /etc/nginx/conf.d/proxy-params.conf;
    }
}
