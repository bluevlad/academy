# Academy 통합 학원 운영 시스템 — compose
#
# 4 컨테이너: backend · admin-web · user-web · redis
# DB (MariaDB) 는 호스트 네이티브 mariadbd 를 host.docker.internal 로 접근.
#
# 환경변수 (ENVIRONMENT_STANDARD §8.3 — Single Source of Truth):
#   운영: /Users/rainend/GIT/Claude-Opus-bluevlad/infrastructure/docker/.env.production
#   로컬 개발: academy repo 루트의 .env (gitignored)
#   접두사 규약 §8.2: Academy 전용은 ACADEMY_*, 공통은 GOOGLE_*/SUPER_ADMIN_*/TZ
#
# 포트 (§5.2): Admin 4001, User 4002, Backend 9001 (monorepo 단일)
#
# 기동:  docker compose --profile all up -d
# 로그:  docker compose logs -f --tail=100 academy-backend
services:

  academy-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: academy-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${ACADEMY_SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 9001
      DB_URL: ${ACADEMY_DB_URL:-jdbc:mariadb://host.docker.internal:3306/acm_basic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&useSSL=false}
      DB_USERNAME: ${ACADEMY_DB_USERNAME:-root}
      DB_PASSWORD: ${ACADEMY_DB_PASSWORD:?ACADEMY_DB_PASSWORD is required}
      DB_DRIVER: ${ACADEMY_DB_DRIVER:-org.mariadb.jdbc.Driver}
      REDIS_HOST: ${ACADEMY_REDIS_HOST:-academy-redis}
      REDIS_PORT: ${ACADEMY_REDIS_PORT:-6379}
      REDIS_PASSWORD: ${ACADEMY_REDIS_PASSWORD:-}
      JWT_SECRET: ${ACADEMY_JWT_SECRET:?ACADEMY_JWT_SECRET is required}
      JWT_ACCESS_TTL: ${ACADEMY_JWT_ACCESS_TTL:-PT30M}
      JWT_REFRESH_TTL: ${ACADEMY_JWT_REFRESH_TTL:-P14D}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      CORS_ALLOWED_ORIGINS: ${ACADEMY_CORS_ORIGINS:-https://academy.unmong.com,http://localhost:4001,http://localhost:4002}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${ACADEMY_BACKEND_PORT:-9001}:9001"
    depends_on:
      - academy-redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    profiles:
      - all
      - backend

  academy-admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    container_name: academy-admin-web
    environment:
      VITE_API_BASE_URL: ${ACADEMY_VITE_ADMIN_API_BASE_URL:-/api}
    ports:
      - "${ACADEMY_ADMIN_WEB_PORT:-4001}:80"
    depends_on:
      - academy-backend
    restart: unless-stopped
    profiles:
      - all
      - frontend

  academy-user-web:
    build:
      context: .
      dockerfile: apps/user-web/Dockerfile
    container_name: academy-user-web
    environment:
      VITE_API_BASE_URL: ${ACADEMY_VITE_USER_API_BASE_URL:-/api}
    ports:
      - "${ACADEMY_USER_WEB_PORT:-4002}:80"
    depends_on:
      - academy-backend
    restart: unless-stopped
    profiles:
      - all
      - frontend

  # Redis — 캐시·JWT refresh·장바구니 임시
  academy-redis:
    image: redis:7-alpine
    container_name: academy-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - academy_redis_data:/data
    restart: unless-stopped
    profiles:
      - all
      - backend

volumes:
  academy_redis_data:
