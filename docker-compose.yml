# Academy 통합 학원 운영 시스템 — 개발 compose
#
# 4 컨테이너: backend · admin-web · user-web · redis
# DB (MariaDB) 는 외부 network(database-network) 의 기존 postgresql/mariadb 컨테이너 재사용.
#
# 기동:  docker compose --profile all up -d
# 로그:  docker compose logs -f --tail=100 academy-backend
services:

  academy-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: academy-backend
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 9000
      DB_URL: ${DB_URL:-jdbc:mariadb://mariadb:3306/acm_basic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_DRIVER: ${DB_DRIVER:-org.mariadb.jdbc.Driver}
      REDIS_HOST: ${REDIS_HOST:-academy-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4001,http://localhost:3003}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${BACKEND_PORT:-9000}:9000"
    depends_on:
      - academy-redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - database-network
    profiles:
      - all
      - backend

  academy-admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
    container_name: academy-admin-web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:9000/api}
    ports:
      - "${ADMIN_WEB_PORT:-4001}:3000"
    depends_on:
      - academy-backend
    restart: unless-stopped
    networks:
      - database-network
    profiles:
      - all
      - frontend

  academy-user-web:
    build:
      context: ./user-web
      dockerfile: Dockerfile
    container_name: academy-user-web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:9000/api}
    ports:
      - "${USER_WEB_PORT:-3003}:3000"
    depends_on:
      - academy-backend
    restart: unless-stopped
    networks:
      - database-network
    profiles:
      - all
      - frontend

  # Redis — 캐시·JWT refresh·장바구니 임시
  academy-redis:
    image: redis:7-alpine
    container_name: academy-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - academy_redis_data:/data
    restart: unless-stopped
    networks:
      - database-network
    profiles:
      - all
      - backend

volumes:
  academy_redis_data:

networks:
  # 외부 공유 네트워크 (MariaDB·PostgreSQL 공용). 존재하지 않으면:
  #   docker network create database-network
  database-network:
    external: true
