# Academy 통합 학원 운영 시스템 — 개발 compose
#
# 4 컨테이너: backend · admin-web · user-web · redis
# DB (MariaDB) 는 호스트에서 실행 중인 mariadbd 를 host.docker.internal 로 직접 접근
# (academy-admin 기존 방식과 동일).
#
# 기동:  docker compose --profile all up -d
# 로그:  docker compose logs -f --tail=100 academy-backend
#
# FE 경로 (ADR-006):
#   apps/admin-web  — Vite 7 + React 19 + TS + Ant Design 6 (port 4001)
#   apps/user-web   — 동일 스택                               (port 3003)
services:

  academy-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: academy-backend
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 9000
      DB_URL: ${DB_URL:-jdbc:mariadb://host.docker.internal:3306/acm_basic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&useSSL=false}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_DRIVER: ${DB_DRIVER:-org.mariadb.jdbc.Driver}
      REDIS_HOST: ${REDIS_HOST:-academy-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT30M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P14D}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4001,http://localhost:3003}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${BACKEND_PORT:-9000}:9000"
    depends_on:
      - academy-redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    profiles:
      - all
      - backend

  academy-admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    container_name: academy-admin-web
    environment:
      # build time 주입 (Vite 는 런타임 env 지원 안 함 — Nginx 정적 서빙)
      VITE_API_BASE_URL: ${VITE_ADMIN_API_BASE_URL:-/api}
    ports:
      - "${ADMIN_WEB_PORT:-4001}:80"
    depends_on:
      - academy-backend
    restart: unless-stopped
    profiles:
      - all
      - frontend

  academy-user-web:
    build:
      context: .
      dockerfile: apps/user-web/Dockerfile
    container_name: academy-user-web
    environment:
      VITE_API_BASE_URL: ${VITE_USER_API_BASE_URL:-/api}
    ports:
      - "${USER_WEB_PORT:-3003}:80"
    depends_on:
      - academy-backend
    restart: unless-stopped
    profiles:
      - all
      - frontend

  # Redis — 캐시·JWT refresh·장바구니 임시
  academy-redis:
    image: redis:7-alpine
    container_name: academy-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - academy_redis_data:/data
    restart: unless-stopped
    profiles:
      - all
      - backend

volumes:
  academy_redis_data:
