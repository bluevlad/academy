# =============================================================================
# [SUSPENDED] Academy 단독 docker 운영 중단 — 2026-04-28
# -----------------------------------------------------------------------------
# 사유: academy 가 hopenvision 통합 환경으로 흡수됨. 운영은 hopenvision 쪽에서
#       단일 compose 로 관리. 이 파일은 단독 재개 가능성을 위해 보존만 한다.
#
# 자동 재시작 정책:
#   - 모든 서비스 restart: "no" — Docker daemon/서버 재부팅 시에도 살아나지 않음.
#   - `docker compose ... up` 을 명시적으로 호출하지 않는 한 절대 기동되지 않음.
#
# 단독 재개가 필요한 경우 (긴급 시나리오 한정):
#   1) hopenvision 에서 academy 가 분리된 상태인지 확인 (포트 9001/4001/4002/6379 충돌 주의)
#   2) cd /Users/rainend/GIT/academy
#   3) docker compose --profile all up -d
#   4) 운영 종료 시 즉시 docker compose --profile all down
#
# 보존 자산:
#   - 이미지: academy-academy-{backend,admin-web,user-web,agent} (rebuild 없이 재기동 가능)
#   - 볼륨:  academy_redis_data (Redis 영속 데이터, 삭제 금지)
#
# 원본 운영 메모 (참고):
#   4 컨테이너: backend · admin-web · user-web · redis (+ agent)
#   DB(MariaDB) 호스트 네이티브 → host.docker.internal
#   환경변수 SSoT: /Users/rainend/GIT/Ai-Legacy-bluevlad/infrastructure/docker/.env.production
#   포트(ENVIRONMENT_STANDARD §5.2): Admin 4001 · User 4002 · Backend 9001
# =============================================================================
services:

  academy-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: academy-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${ACADEMY_SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 9001
      DB_URL: ${ACADEMY_DB_URL:-jdbc:mariadb://host.docker.internal:3306/acm_basic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&useSSL=false}
      DB_USERNAME: ${ACADEMY_DB_USERNAME:-root}
      DB_PASSWORD: ${ACADEMY_DB_PASSWORD:?ACADEMY_DB_PASSWORD is required}
      DB_DRIVER: ${ACADEMY_DB_DRIVER:-org.mariadb.jdbc.Driver}
      REDIS_HOST: ${ACADEMY_REDIS_HOST:-academy-redis}
      REDIS_PORT: ${ACADEMY_REDIS_PORT:-6379}
      REDIS_PASSWORD: ${ACADEMY_REDIS_PASSWORD:-}
      JWT_SECRET: ${ACADEMY_JWT_SECRET:?ACADEMY_JWT_SECRET is required}
      JWT_ACCESS_TTL: ${ACADEMY_JWT_ACCESS_TTL:-PT30M}
      JWT_REFRESH_TTL: ${ACADEMY_JWT_REFRESH_TTL:-P14D}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-rainend00@gmail.com}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-admin,rainend}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dnflskfk}
      CORS_ALLOWED_ORIGINS: ${ACADEMY_CORS_ORIGINS:-https://academy.unmong.com,http://localhost:4001,http://localhost:4002}
      ACADEMY_AGENT_URL: ${ACADEMY_AGENT_URL:-http://academy-agent:9011}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${ACADEMY_BACKEND_PORT:-9001}:9001"
    depends_on:
      - academy-redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"  # SUSPENDED — hopenvision 통합 후 단독 운영 중단 (2026-04-28)
    profiles:
      - all
      - backend

  academy-admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        # 번들 빌드 타임에 inline — 컨테이너 env 는 vite 빌드 결과물에 반영되지 않음.
        VITE_API_BASE_URL: ${ACADEMY_VITE_ADMIN_API_BASE_URL:-/admin/api}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: academy-admin-web
    ports:
      - "${ACADEMY_ADMIN_WEB_PORT:-4001}:80"
    depends_on:
      - academy-backend
    restart: "no"  # SUSPENDED — hopenvision 통합 후 단독 운영 중단 (2026-04-28)
    profiles:
      - all
      - frontend

  academy-user-web:
    build:
      context: .
      dockerfile: apps/user-web/Dockerfile
    container_name: academy-user-web
    environment:
      VITE_API_BASE_URL: ${ACADEMY_VITE_USER_API_BASE_URL:-/api}
    ports:
      - "${ACADEMY_USER_WEB_PORT:-4002}:80"
    depends_on:
      - academy-backend
    restart: "no"  # SUSPENDED — hopenvision 통합 후 단독 운영 중단 (2026-04-28)
    profiles:
      - all
      - frontend

  # CS Agent — Phase B, Python FastAPI + Ollama 로컬 LLM 연동
  # 호스트 Ollama(:11434) 의 Metal 가속을 활용하려고 호스트 ollama 에 HTTP 호출.
  # 관련 플랜: Ai-Legacy-bluevlad/services/academy/CS_INQUIRY_AI_PLAN.md
  academy-agent:
    build:
      context: ./services/agent
      dockerfile: Dockerfile
    container_name: academy-agent
    environment:
      OLLAMA_BASE_URL: ${ACADEMY_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CLASSIFIER_MODEL: ${ACADEMY_AGENT_CLASSIFIER_MODEL:-qwen2.5:7b}
      EMBEDDING_MODEL: ${ACADEMY_AGENT_EMBEDDING_MODEL:-nomic-embed-text}
      DB_HOST: ${ACADEMY_AGENT_DB_HOST:-host.docker.internal}
      DB_PORT: ${ACADEMY_AGENT_DB_PORT:-3306}
      DB_USER: ${ACADEMY_DB_USERNAME:-root}
      DB_PASSWORD: ${ACADEMY_DB_PASSWORD:?ACADEMY_DB_PASSWORD is required}
      DB_NAME: ${ACADEMY_DB_NAME:-acm_basic}
      AGENT_PORT: 9011
    ports:
      - "${ACADEMY_AGENT_PORT:-9011}:9011"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"  # SUSPENDED — hopenvision 통합 후 단독 운영 중단 (2026-04-28)
    profiles:
      - all
      - agent

  # Redis — 캐시·JWT refresh·장바구니 임시
  academy-redis:
    image: redis:7-alpine
    container_name: academy-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - academy_redis_data:/data
    restart: "no"  # SUSPENDED — hopenvision 통합 후 단독 운영 중단 (2026-04-28)
    profiles:
      - all
      - backend

volumes:
  academy_redis_data:
