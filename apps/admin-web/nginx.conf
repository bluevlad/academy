server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # /api/* 는 backend 로 proxy (docker network: database-network)
  location /api/ {
    proxy_pass http://academy-backend:9000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
  }

  # 정적 자원 캐시
  location ~* \.(js|css|woff2?|eot|ttf|svg|png|jpg|jpeg|gif|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  # gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml text/xml;
  gzip_min_length 1024;
}
