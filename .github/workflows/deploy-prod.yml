name: Deploy Academy to Production

# =============================================================================
# [SUSPENDED] 자동 배포 비활성 — 2026-04-28
# 사유: academy 가 hopenvision 통합 환경으로 흡수됨. 운영 배포는 hopenvision 쪽에서 처리.
#       prod 브랜치에 push 가 들어와도 자동 docker compose up 되지 않도록 push 트리거 제거.
# 단독 재개: 아래 push 트리거 주석을 풀고, 루트 docker-compose.yml 의 restart 정책도
#            함께 unless-stopped 로 되돌려야 함 (현재 restart: "no" 로 설정됨).
# 수동 실행 한정으로 workflow_dispatch 만 남겨둠 — Actions UI 에서 명시적으로만 실행 가능.
# =============================================================================
on:
  workflow_dispatch:
  # push:
  #   branches: [ "prod" ]

env:
  # Ai-Legacy-bluevlad ENVIRONMENT_STANDARD §8.3 — Single Source of Truth
  ENV_PRODUCTION_PATH: /Users/rainend/GIT/Ai-Legacy-bluevlad/infrastructure/docker/.env.production

jobs:
  deploy:
    name: Deploy Academy on Self-Hosted Runner
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Link .env to host SSoT (.env.production)
      shell: bash
      run: |
        if [ ! -f "${ENV_PRODUCTION_PATH}" ]; then
          echo "::error::${ENV_PRODUCTION_PATH} not found. ENVIRONMENT_STANDARD §8.3 SSoT 미설치."
          exit 1
        fi
        ln -sfn "${ENV_PRODUCTION_PATH}" .env
        echo "Linked .env -> ${ENV_PRODUCTION_PATH}"

    - name: Docker Compose Down
      shell: bash
      run: docker compose --profile all down --remove-orphans
      continue-on-error: true

    - name: Docker Compose Build and Up
      shell: bash
      run: docker compose --profile all up -d --build

    - name: Health Check
      shell: bash
      run: |
        echo "Waiting for application to start..."
        sleep 20
        curl -f -s -o /dev/null --retry 10 --retry-delay 10 --retry-connrefused \
          "http://localhost:9001/actuator/health" \
          && echo "Health check passed" \
          || echo "Warning: Health check failed after retries - container may still be starting up. Check manually."
